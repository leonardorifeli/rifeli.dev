<button class="toggle-theme" aria-label="Toggle Theme" title="Toggle Theme" onclick="toggleTheme()">
  <span class="theme-icon light"> {{ partial "utils/icon" "sun" }} </span>
  <span class="theme-icon dark"> {{ partial "utils/icon" "moon" }} </span>
</button>

<script>
  /* O default do site e dark, igual ao que o baseof pinta antes da primeira
     tinta. Antes esse arquivo caia em 'light' quando o localStorage estava
     vazio, o que forcava claro em visitante novo numa pagina que tinha
     acabado de ser pintada de escuro. */
  document.addEventListener('DOMContentLoaded', function () {
    applyTheme(localStorage.getItem('theme') === 'light' ? 'light' : 'dark');
  });

  /* applyTheme mexe no DOM. setTheme mexe no DOM e persiste. A separacao
     importa: o handler de storage precisa aplicar SEM escrever, senao as
     abas ficam se re-notificando em loop. */
  function applyTheme(theme) {
    const html = document.querySelector('html');

    if (theme === 'light') {
      html.classList.remove('dark');
      document.querySelector('.theme-icon.light').style.display = 'none';
      document.querySelector('.theme-icon.dark').style.display = 'block';
    } else {
      html.classList.add('dark');
      document.querySelector('.theme-icon.dark').style.display = 'none';
      document.querySelector('.theme-icon.light').style.display = 'block';
    }

    updateGiscusTheme(theme);
  }

  function setTheme(theme) {
    localStorage.setItem('theme', theme);
    applyTheme(theme);
  }

  function toggleTheme() {
    setTheme(localStorage.getItem('theme') === 'light' ? 'dark' : 'light');
  }

  /* Sincroniza o iframe do giscus numa troca ao vivo. A carga inicial nao
     depende mais daqui: o partial do giscus injeta o script com o data-theme
     ja resolvido, entao nao existe mais a corrida contra o listener. */
  function updateGiscusTheme(theme) {
    const iframe = document.querySelector('iframe.giscus-frame');
    if (!iframe) { return; }

    iframe.contentWindow.postMessage(
      { giscus: { setConfig: { theme: theme === 'light' ? 'light' : 'dark' } } },
      'https://giscus.app'
    );
  }

  /* Troca de tema feita em outra aba. */
  window.addEventListener('storage', function (event) {
    if (event.key === 'theme') {
      applyTheme(event.newValue === 'light' ? 'light' : 'dark');
    }
  });
</script>
